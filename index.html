<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GBA QR Code Generator</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Using retro pixel font from Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- QR Code generation library -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    

    <style>

        :root {

            --bg-color: #0f0c1b;

            --gba-body: #5c52a3; /* Classic GBA Purple/Indigo */

            --gba-dark: #3f3685;

            --gba-light: #7b71c2;

            --bezel-color: #2d2d35;

            --screen-bg: #001100;

            --text-glow: #39ff14;

            --btn-action: #e74c3c;

            --btn-action-dark: #c0392b;

            --dpad-color: #1e1e24;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            background-color: var(--bg-color);

            background-image: 

                linear-gradient(45deg, #05040a 25%, transparent 25%, transparent 75%, #05040a 75%, #05040a), 

                linear-gradient(45deg, #05040a 25%, transparent 25%, transparent 75%, #05040a 75%, #05040a);

            background-size: 20px 20px;

            background-position: 0 0, 10px 10px;

            font-family: 'Press Start 2P', cursive;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            color: white;

            padding: 15px;

        }


        /* GBA Handheld Console */

        .gba-console {

            background-color: var(--gba-body);

            padding: 30px 20px 25px;

            border-radius: 24px 24px 60px 60px;

            box-shadow: 

                inset 0 8px 0 rgba(255,255,255,0.3),

                inset 0 -12px 0 rgba(0,0,0,0.4),

                0 20px 40px rgba(0,0,0,0.8);

            width: 100%;

            max-width: 520px;

            text-align: center;

            position: relative;

            border: 6px solid #1a153a;

        }


        /* L & R Shoulder Buttons */

        .shoulder-buttons {

            position: absolute;

            top: -12px;

            left: 0;

            right: 0;

            display: flex;

            justify-content: space-between;

            padding: 0 40px;

            z-index: -1;

        }


        .shoulder-btn {

            width: 70px;

            height: 18px;

            background-color: #8e8e93;

            border: 4px solid #1a153a;

            border-bottom: none;

            border-radius: 8px 8px 0 0;

            box-shadow: inset 0 4px 0 rgba(255,255,255,0.5);

        }


        /* Title Logo GBA Style */

        .brand-header {

            margin-bottom: 15px;

            text-shadow: 2px 2px 0 #1a153a;

        }


        .brand-header h1 {

            font-size: 16px;

            color: #dcdde1;

            letter-spacing: 2px;

            font-style: italic;

        }


        .brand-header span {

            color: #e74c3c;

            font-weight: bold;

        }


        /* Screen Bezel */

        .screen-bezel {

            background-color: var(--bezel-color);

            padding: 20px 20px 30px;

            border-radius: 12px;

            border: 5px solid #1e1e24;

            box-shadow: inset 0 5px 15px rgba(0,0,0,0.7);

            position: relative;

            margin-bottom: 20px;

        }


        /* Screen Power LED */

        .power-led {

            position: absolute;

            left: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 8px;

            height: 8px;

            background-color: #39ff14;

            border-radius: 50%;

            box-shadow: 0 0 8px #39ff14;

        }


        /* Screen Title Badge */

        .bezel-title {

            font-size: 8px;

            color: #7f8c8d;

            letter-spacing: 1px;

            margin-top: 10px;

            text-transform: uppercase;

        }


        .bezel-title span {

            color: #3498db;

        }


        /* LCD Screen */

        .screen {

            background-color: var(--screen-bg);

            height: 200px;

            border: 4px solid #000;

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 10px;

            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);

        }


        /* Scanline CRT Effect */

        .screen::before {

            content: " ";

            display: block;

            position: absolute;

            top: 0; left: 0; bottom: 0; right: 0;

            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);

            z-index: 2;

            background-size: 100% 4px;

            pointer-events: none;

        }


        /* Text inside screen */

        .screen-text {

            color: var(--text-glow);

            text-shadow: 0 0 5px var(--text-glow);

            font-size: 10px;

            text-align: center;

            line-height: 1.8;

            z-index: 1;

        }


        .blink {

            animation: blink 1s step-end infinite;

        }


        /* QR Code Container */

        #qrcode {

            z-index: 1;

            background: white;

            padding: 8px;

            display: none;

            box-shadow: 0 0 10px var(--text-glow);

            border-radius: 2px;

        }


        #qrcode img {

            display: block;

            margin: 0 auto;

            width: 140px;

            height: 140px;

        }


        /* Bottom Controls (D-pad & Buttons Side-by-Side) */

        .gba-controls {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 15px;

            padding: 0 10px;

        }


        /* D-PAD Layout */

        .dpad-container {

            width: 80px;

            height: 80px;

            position: relative;

        }


        .dpad {

            width: 100%;

            height: 100%;

            position: relative;

        }


        .dpad-btn {

            background-color: var(--dpad-color);

            position: absolute;

            border: 2px solid #000;

            box-shadow: inset 0 2px 0 rgba(255,255,255,0.1);

        }


        .dpad-center {

            width: 26px;

            height: 26px;

            background-color: var(--dpad-color);

            position: absolute;

            top: 27px;

            left: 27px;

            z-index: 2;

        }


        .dpad-up {

            width: 26px;

            height: 28px;

            top: 0;

            left: 27px;

            border-radius: 4px 4px 0 0;

        }


        .dpad-down {

            width: 26px;

            height: 28px;

            bottom: 0;

            left: 27px;

            border-radius: 0 0 4px 4px;

        }


        .dpad-left {

            width: 28px;

            height: 26px;

            top: 27px;

            left: 0;

            border-radius: 4px 0 0 4px;

        }


        .dpad-right {

            width: 28px;

            height: 26px;

            top: 27px;

            right: 0;

            border-radius: 0 4px 4px 0;

        }


        /* Action Buttons (A & B) */

        .action-buttons {

            display: flex;

            gap: 15px;

            background-color: var(--gba-dark);

            padding: 8px 15px;

            border-radius: 30px;

            transform: rotate(-15deg);

            border: 3px solid #1a153a;

            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);

        }


        .btn-round {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background-color: var(--btn-action);

            border: 3px solid #000;

            color: rgba(255, 255, 255, 0.9);

            font-family: 'Press Start 2P', cursive;

            font-size: 12px;

            font-weight: bold;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            box-shadow: 

                inset -2px -4px 0px rgba(0,0,0,0.4),

                inset 2px 2px 0px rgba(255,255,255,0.3),

                0 4px 0 rgba(0,0,0,0.5);

            user-select: none;

        }


        .btn-round:active {

            box-shadow: 

                inset -2px -2px 0px rgba(0,0,0,0.4),

                inset 2px 2px 0px rgba(255,255,255,0.3);

            transform: translateY(2px);

            background-color: var(--btn-action-dark);

        }


        /* Select and Start Utility Buttons */

        .utility-buttons {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 25px;

        }


        .util-btn-wrapper {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 5px;

        }


        .util-btn {

            width: 35px;

            height: 10px;

            background-color: #7f8c8d;

            border: 2px solid #000;

            border-radius: 5px;

            transform: rotate(-25deg);

            box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 2px 0 #000;

            cursor: pointer;

        }


        .util-btn:active {

            transform: rotate(-25deg) translateY(1px);

            box-shadow: none;

        }


        .util-label {

            font-size: 6px;

            color: #bdc3c7;

            text-shadow: 1px 1px 0 #000;

        }


        /* Speaker Grille Decoration */

        .speaker-grille {

            display: flex;

            flex-direction: column;

            gap: 4px;

            position: absolute;

            right: 25px;

            bottom: 15px;

            transform: rotate(-25deg);

        }


        .speaker-line {

            width: 20px;

            height: 3px;

            background-color: var(--gba-dark);

            border-radius: 2px;

        }


        /* Inputs and Cartridge Style dock below console */

        .input-dock {

            margin-top: 25px;

            background-color: #34495e;

            padding: 18px;

            border-radius: 12px;

            border: 4px solid #2c3e50;

            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.5);

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        input[type="text"] {

            width: 100%;

            padding: 12px;

            font-family: 'Press Start 2P', cursive;

            font-size: 10px;

            background-color: #000;

            color: var(--text-glow);

            border: 3px solid #1a1a1a;

            outline: none;

            text-shadow: 0 0 5px var(--text-glow);

            border-radius: 4px;

        }


        input[type="text"]::placeholder {

            color: #030;

        }


        input[type="text"]:focus {

            border-color: var(--text-glow);

        }


        /* Main Submit button styled as a classic Retro Cartridge label */

        .generate-btn {

            font-family: 'Press Start 2P', cursive;

            background-color: #27ae60;

            color: white;

            border: none;

            padding: 12px;

            font-size: 12px;

            cursor: pointer;

            text-transform: uppercase;

            border-radius: 4px;

            box-shadow: 

                inset -3px -6px 0px rgba(0,0,0,0.3),

                inset 3px 3px 0px rgba(255,255,255,0.4),

                0 4px 0 #1b5e20;

            transition: all 0.1s;

        }


        .generate-btn:active {

            box-shadow: 

                inset -3px -3px 0px rgba(0,0,0,0.3),

                inset 3px 3px 0px rgba(255,255,255,0.4);

            transform: translateY(3px);

            background-color: #2196f3;

        }


        /* Animations */

        @keyframes blink {

            0%, 100% { opacity: 1; }

            50% { opacity: 0; }

        }


    </style>

</head>

<body>


    <div class="shoulder-buttons">

        <div class="shoulder-btn"></div>

        <div class="shoulder-btn"></div>

    </div>


    <div class="gba-console">

        <div class="brand-header">

            <h1>GAME BOY <span>ADVANCE</span></h1>

        </div>


        <div class="screen-bezel">

            <div class="power-led"></div>

            <div class="screen" id="screen-display">

                <!-- Default Screen Text -->

                <div id="default-text" class="screen-text">

                    <p class="blink">INSERT CARTRIDGE</p>

                    <br>

                    <p class="blink">OR</p>

                    <br>

                    <p class="blink">INSERT TEXT/ URL</p>

                </div>

                <!-- QR Code Target -->

                <div id="qrcode"></div>

            </div>

            <div class="bezel-title">QR Code <span>Generator</span></div>

        </div>


        <!-- Handheld Console Controls -->

        <div class="gba-controls">

            <!-- Left D-Pad -->

            <div class="dpad-container">

                <div class="dpad">

                    <div class="dpad-center"></div>

                    <div class="dpad-btn dpad-up"></div>

                    <div class="dpad-btn dpad-down"></div>

                    <div class="dpad-btn dpad-left"></div>

                    <div class="dpad-btn dpad-right"></div>

                </div>

            </div>


            <!-- Right A/B Action Buttons -->

            <div class="action-buttons">

                <div class="btn-round" id="btn-b">B</div>

                <div class="btn-round" id="btn-a">A</div>

            </div>

        </div>


        <!-- Select and Start Buttons -->

        <div class="utility-buttons">

            <div class="util-btn-wrapper">

                <div class="util-btn" id="btn-select"></div>

                <div class="util-label">SELECT</div>

            </div>

            <div class="util-btn-wrapper">

                <div class="util-btn" id="btn-start"></div>

                <div class="util-label">START</div>

            </div>

        </div>


        <!-- Decorative speaker lines -->

        <div class="speaker-grille">

            <div class="speaker-line"></div>

            <div class="speaker-line"></div>

            <div class="speaker-line"></div>

            <div class="speaker-line"></div>

        </div>

    </div>


    <!-- Input Box resembling a cartridge slot dock below the system -->

    <div style="width: 100%; max-width: 520px;">

        <div class="input-dock">

            <input type="text" id="qr-input" placeholder="INSERT TEXT / URL HERE..." autocomplete="off">

            <button class="generate-btn" id="generate-btn">GENERATE</button>

        </div>

    </div>


    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const generateBtn = document.getElementById('generate-btn');

            const btnA = document.getElementById('btn-a');

            const btnB = document.getElementById('btn-b');

            const btnStart = document.getElementById('btn-start');

            const btnSelect = document.getElementById('btn-select');

            

            const qrInput = document.getElementById('qr-input');

            const qrContainer = document.getElementById('qrcode');

            const defaultText = document.getElementById('default-text');

            const screenDisplay = document.getElementById('screen-display');


            let qrCodeObj = null;


            // Generate QR Code Function

            function generateQR() {

                const textValue = qrInput.value.trim();


                // Validate if input is empty

                if (!textValue) {

                    showError("ERROR!\nEMPTY INPUT");

                    return;

                }


                // Hide default text

                defaultText.style.display = 'none';

                

                // Show QR Container

                qrContainer.style.display = 'block';

                qrContainer.innerHTML = ''; // Clear previous QR


                // Fast screen flicker effect

                screenDisplay.style.backgroundColor = '#003300';

                setTimeout(() => {

                    screenDisplay.style.backgroundColor = 'var(--screen-bg)';

                    

                    // Generate new QR Code

                    qrCodeObj = new QRCode(qrContainer, {

                        text: textValue,

                        width: 140,

                        height: 140,

                        colorDark : "#000000",

                        colorLight : "#ffffff",

                        correctLevel : QRCode.CorrectLevel.H

                    });

                }, 150);

            }


            // Display error message on screen

            function showError(message) {

                qrContainer.style.display = 'none';

                defaultText.style.display = 'block';

                defaultText.innerHTML = `<p class="blink" style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">${message.replace('\n', '<br>')}</p>`;

                

                // Reset screen back to default state after 2.5 seconds

                setTimeout(() => {

                    defaultText.innerHTML = `

                        <p class="blink">INSERT CARTRIDGE</p>

                        <br>

                        <p class="blink">OR</p>

                        <br>

                        <p class="blink">ENTER TEXT/URL</p>

                    `;

                }, 2500);

            }


            // Interactive Buttons Easter Egg: Action "A" and "START" can also trigger QR Code generation

            generateBtn.addEventListener('click', generateQR);

            btnA.addEventListener('click', generateQR);

            btnStart.addEventListener('click', generateQR);


            // "B" and "SELECT" button clears the text input and resets screen

            const resetScreen = () => {

                qrInput.value = '';

                qrContainer.style.display = 'none';

                defaultText.style.display = 'block';

                defaultText.innerHTML = `

                    <p class="blink">INSERT CARTRIDGE</p>

                    <br>

                    <p class="blink">OR</p>

                    <br>

                    <p class="blink">ENTER TEXT/URL</p>

                `;

            };

            btnB.addEventListener('click', resetScreen);

            btnSelect.addEventListener('click', resetScreen);


            // Allow Enter key to generate

            qrInput.addEventListener('keypress', function (e) {

                if (e.key === 'Enter') {

                    generateQR();

                }

            });

        });

    </script>

</body>

</html>
